# AirPen 設定ファイル
# 変更後は /airpen reload で反映されます。

# 設定ファイルの形式の版(古い既定値の自動更新に使います。変更しないでください)
config-version: 2

# ペンのアイテム
pen:
  # アイテムの種類
  material: BLAZE_ROD
  # 表示名(MiniMessage 形式)
  name: '<gold>エアペン'
  # 説明文(MiniMessage 形式)。この下にインク残量の行が自動で付きます
  lore:
    - '<gray>右クリック長押し: 描く'
    - '<gray>左クリック: メニュー(見て左クリックで決定)'
  # カスタムモデルデータ(0 = 使わない)
  custom-model-data: 0

# 描画
drawing:
  # 目からペン先までの距離(ブロック)の初期値。各プレイヤーはメニューの「描く位置」で自分用に変えられます
  distance: 2.0
  # 「描く位置」で選べる距離の範囲(ブロック)。手が届く範囲(約 4.5)より内側にしてください
  distance-min: 0.5
  distance-max: 3.0
  # 線の描き方
  #   dots   = 常にこちらを向く正方形の点を並べる。どの角度からも見え、消しゴムは触れた所だけ消す(エンティティ数は最も多い)
  #   ribbon = 描いた人の方を向く平らな帯。色は指定どおり
  #   bar    = 細長く伸ばしたブロック。色は指定色に近いブロックで代用
  style: ribbon
  # dots のときの点の間隔(線の太さに対する割合)。小さいほどなめらかになり、エンティティが増える
  dot-spacing: 0.5
  # ペン先がこの距離(ブロック)以上動いたら次の点を足す
  min-step: 0.03
  # ribbon / bar のとき、曲がり方がこの角度(度)未満なら、新しい区間を足さずに直前の区間を伸ばす
  merge-angle: 4.0
  # 手ぶれ補正の強さ。ゆっくり動かしたときに、1 tick で実際のペン先へ近づく割合(1.0 = 補正なし)
  # 速く動かしたときは補正せず、そのまま追従します
  smoothing: 0.5
  # ribbon / bar のとき、1つの区間を伸ばせる最大の長さ(ブロック)
  max-segment-length: 4.0
  # インクの量: 1人が同時に描いておける点(または区間)の数
  # 使い切ると、消しゴム・元に戻す・全部消す で減らすまで描けません。ペンの耐久値バーに残量が出ます
  # airpen.unlimited 権限(admin は自動で付く)を持つ人は無制限
  max-segments-per-player: 2000
  # 見ている人からこの距離(ブロック)より遠いインクは描画しない(消えるわけではありません)
  # クライアントの描画負荷を下げます。各プレイヤーのビデオ設定「エンティティ描画距離」の倍率でも変わります
  view-distance: 50
  # 線を常に最大の明るさで表示する(暗い場所でも明るく見える)
  full-bright: true

# 本人がログアウト・ワールド移動したとき、または線の描き始めからこの距離(ブロック)以上離れたとき、その人の線を消す
# (0 = ログアウトとワールド移動のときだけ消す)
auto-clear-distance: 100

# 消しゴム
eraser:
  # 視線の先でいちばん手前にあるインクを探す最大距離(ブロック)
  range: 4
  # そこを中心に消す範囲の半径(ブロック)
  radius: 0.1

# TextDisplay の背景(" " 1文字分)の大きさ(ブロック)。ribbon と dots の形の計算に使います
# 通常は変更不要です。/airpen calibrate で出る赤い四角がブロックの面とずれる場合だけ調整してください
ribbon:
  base-x: -0.05
  base-y: 0.0
  base-width: 0.125
  base-height: 0.275
  # ribbon のとき、裏向きの板も重ねて裏側からも見えるようにする
  double-sided: true

# 線の太さ(ブロック)。スライダーで選べる範囲と初期値
# プレイヤーには 100 倍した整数で表示されます(0.04 = 4)
width:
  min: 0.01
  max: 0.30
  default: 0.04

# 色メニューのプリセット(16進数の RGB)。これ以外の色もチャットで #RRGGBB を入力して使えます
colors:
  - {name: '白', hex: '#F0F0F0'}
  - {name: '黒', hex: '#141414'}
  - {name: '赤', hex: '#E03030'}
  - {name: 'オレンジ', hex: '#F08020'}
  - {name: '黄', hex: '#F0D020'}
  - {name: '緑', hex: '#40C040'}
  - {name: '水色', hex: '#40B0F0'}
  - {name: '青', hex: '#3050E0'}
  - {name: '紫', hex: '#9040D0'}
  - {name: 'ピンク', hex: '#F070B0'}

# メニュー(左クリックで開き、見ている項目を左クリックで決定)
menu:
  # 目からメニューまでの距離(ブロック)。小さいほど近く、大きく見えます(太さのスライダーにも適用)
  distance: 1.8
  # ラジアルメニューの項目を並べる円の半径(ブロック)
  radius: 1.2
  # 中心からこの半径(ブロック)以内を見て左クリックするとキャンセル
  center-radius: 0.38
